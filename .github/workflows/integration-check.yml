name: Integration check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/integration-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Capture integration diagnostics
        shell: bash
        run: |
          mkdir -p artifacts/integration
          git rev-parse HEAD > artifacts/integration/commit.txt
          find src -type f | sort > artifacts/integration/files.txt
          dotnet test tests/TextSpace.Tests/TextSpace.Tests.csproj -c Release --logger 'trx;LogFileName=engine.trx' --results-directory artifacts/integration > artifacts/integration/engine.log 2>&1; ENGINE=$?
          dotnet build src/TextSpace.Workbench/TextSpace.Workbench.csproj -c Release -p:TextSpaceDesktopOnly=true > artifacts/integration/workbench.log 2>&1; UI=$?
          cat artifacts/integration/engine.log artifacts/integration/workbench.log
          printf 'Engine: %s\nWorkbench: %s\n' "$ENGINE" "$UI" > artifacts/integration/result.txt
          git archive --format=zip --output=artifacts/integration/source.zip HEAD
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TextSpace-integration
          path: artifacts/integration

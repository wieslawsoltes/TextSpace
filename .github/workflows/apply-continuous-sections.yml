name: Integrate continuous sections
on:
  push:
    branches: [feat/continuous-sections-performance]
    paths: ['.github/workflows/apply-continuous-sections.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/continuous-sections-performance
          fetch-depth: 0
      - name: Verify source transport and materialize tested tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b40cfafa971d27da5de505f6f9460b7c9f00012d HEAD
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,urllib.request
          blobs=[
            '1d386017442abb81dfd3e2ce0c57cc312cde0ac3',
            '56993d269c5768d70dad4cd72c2aa2e759100f8e',
            '70bdf09882cf6942ffe6c9749fd11b01de885312',
            'd4f9f493fa83d94b39b5db290a55a34c012e4c7d',
            'cb3810174c3aa42198181482fad8d5ccc264a195',
            '1b58ddf8ba3f09905d1f56df0fdbc2b134e0fcad']
          expected=['0bbdba8bf2ab279490f1b4a364026988c11719ec',*blobs[1:]]
          # The first transmitted fragment omitted this known byte range.
          # Verify both transport and canonical hashes; never relax integrity.
          repair=''
          def digest(data): return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          fragments=[]
          for i,sha in enumerate(blobs):
              url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'TextSpace-integration'})
              with urllib.request.urlopen(request,timeout=60) as response: item=json.load(response)
              data=base64.b64decode(item['content'])
              assert digest(data)==sha, 'Transport blob hash mismatch'
              if i==0: data=data[:751]+repair.encode('ascii')+data[751:]
              assert digest(data)==expected[i], 'Canonical fragment mismatch'
              fragments.append(data)
              print('Verified source fragment',i,expected[i])
          patch=gzip.decompress(base64.b64decode(b''.join(fragments),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='c026b86081408b29421aa88aba91103aa59fd1c35158fa6e7f21eacdd2ca6b23', 'Patch SHA256 mismatch'
          assert len(patch)==131748
          pathlib.Path('/tmp/continuous-sections.patch').write_bytes(patch)
          PY
          git apply --check /tmp/continuous-sections.patch
          git apply --index /tmp/continuous-sections.patch
          git diff --cached --check
          git rm --cached .github/workflows/apply-continuous-sections.yml
          TREE=$(git write-tree)
          test "$TREE" = 6f373cf31bcf290d385bb63b9a6ac49d75c2fa86 || { echo "Unexpected source tree: $TREE"; exit 1; }
          git add .github/workflows/apply-continuous-sections.yml
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add continuous sections and indexed viewport interaction'
          git push origin HEAD:feat/continuous-sections-performance
          git show --stat --oneline HEAD

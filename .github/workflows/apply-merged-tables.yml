name: Integrate merged tables
on:
  push:
    branches: [feat/merged-tables-performance]
    paths: ['.github/workflows/apply-merged-tables.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/merged-tables-performance
          fetch-depth: 0
      - name: Verify transport and exact tested source tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b397a304f800529243776ea286ffb96da67f8c10 HEAD
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,urllib.request
          fragments=[
            ('5c9f91ae9e98526e45f6c03c727d441b2b761507','7aa5e84021a4145b08b69c1b63d624e30ba67f01','xi6R5RIqWy','xi6RRIqWy','sRchJnK+mYxD'),
            ('8f825d5c07b4e7ec06c2b284cc531435bf262cc5','707e3f5a7608f7d8c0081b24d6761d330a815d41','fsFLG0dzqsqsU1n','fsFLG0dzqsqU1n','lh50FcrsvU0z'),
            ('f99b67af42afec18d993f21233bd347d42273cfd','3e3f3fe6b685b133db28ae9e055ada452e2b2465','Nja2eN7qLA','Nja2N7qLA','YKxyvp7SN3iF'),
            ('6fee66805568eadda86379b37c0cfe3a883932bc','6fee66805568eadda86379b37c0cfe3a883932bc',None,None,None)]
          def digest(data): return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          packed=[]
          for remote,expected,bad,good,tail in fragments:
              url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+remote
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'TextSpace-integration'})
              with urllib.request.urlopen(request,timeout=60) as response: item=json.load(response)
              data=base64.b64decode(item['content'])
              assert digest(data)==remote, 'Downloaded blob integrity failure'
              if bad:
                  # Restore the three identified single-character transport errors.
                  # Canonical fragment and whole-patch hashes remain mandatory.
                  text=base64.b64encode(data).decode('ascii')
                  assert text.count(bad)==1, 'Unexpected transport marker'
                  text=text.replace(bad,good,1)
                  text=text[:14000-12]+tail
                  data=base64.b64decode(text,validate=True)
              assert digest(data)==expected, 'Canonical fragment integrity failure: '+expected
              packed.append(data)
              print('Verified canonical fragment',expected,len(data))
          patch=gzip.decompress(b''.join(packed))
          expected='3433f63d39ebb68c9754fbcabcb2739da90bd8ca7e887b28a1184682947fa9b1'
          assert hashlib.sha256(patch).hexdigest()==expected, 'Source patch integrity failure'
          pathlib.Path('/tmp/merged-tables.patch').write_bytes(patch)
          print('Verified patch SHA256',expected,len(patch))
          PY
          git apply --check /tmp/merged-tables.patch
          git apply --index /tmp/merged-tables.patch
          git diff --cached --check
          git rm --cached .github/workflows/apply-merged-tables.yml
          TREE=$(git write-tree)
          test "$TREE" = 959d8fe9a2914688045200d18631f5de2be45655 || { echo "Unexpected source tree: $TREE"; exit 1; }
          git add .github/workflows/apply-merged-tables.yml
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add merged nested tables and indexed structural editing'
          git push origin HEAD:feat/merged-tables-performance
          git show --stat --oneline HEAD

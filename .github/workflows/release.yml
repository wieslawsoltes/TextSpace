name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Semantic package version
        type: string
        required: true
        default: 0.5.1-alpha.1
      publish_nuget:
        description: Publish validated packages with the nuget environment's NUGET_API_KEY
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version and locate the successful build of this exact commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${REQUESTED_VERSION:-${GITHUB_REF_NAME#v}}
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo 'Invalid semantic version'; exit 1; }
          SHA=$(git rev-parse HEAD)
          RUN=$(gh api "repos/$REPOSITORY/actions/workflows/build.yml/runs?head_sha=$SHA&status=success&per_page=100" --jq '[.workflow_runs[] | select(.event != "pull_request" and .head_branch == "main")][0].id')
          [[ "$RUN" =~ ^[0-9]+$ ]] || { echo 'This exact commit must first pass Build on main.'; exit 1; }
          gh api "repos/$REPOSITORY/actions/runs/$RUN" > /tmp/source-run.json
          jq -e --arg sha "$SHA" '.head_sha == $sha and .head_branch == "main" and .conclusion == "success" and .event != "pull_request" and .path == ".github/workflows/build.yml"' /tmp/source-run.json
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: TextSpace-browser
          path: artifacts/site
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ github.token }}
      - name: Verify browser artifact provenance
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: jq -e --arg sha "$EXPECTED_SHA" '.application == "TextSpace" and .host == "Uno WebAssembly" and .commit == $sha' artifacts/site/build-info.json
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Validate and pack reusable libraries
        shell: bash
        run: |
          set -euo pipefail
          dotnet workload install wasm-tools --skip-manifest-update
          dotnet test tests/TextSpace.Tests -c Release
          mkdir -p artifacts/release
          for component in Core Documents Editing Layout Skia OpenXml Storage Controls Editor Workbench; do
            dotnet pack "src/TextSpace.$component/TextSpace.$component.csproj" -c Release -p:Version="$VERSION" -p:PackageVersion="$VERSION" -o artifacts/release
          done
      - name: Assemble source and verified browser archives
        env:
          SOURCE_RUN: ${{ steps.source.outputs.run }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --prefix="TextSpace-$VERSION/" --output="artifacts/release/TextSpace-$VERSION-source.zip" HEAD
          python3 - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          root=Path('artifacts/release')
          shutil.make_archive(str(root/f'TextSpace-{os.environ["VERSION"]}-browser'),'zip','artifacts/site')
          info={'version':os.environ['VERSION'],'sourceCommit':os.environ['SOURCE_SHA'],'validatedBuildRun':os.environ['SOURCE_RUN'],'browserBasePath':'/TextSpace/','nugetPublication':'separate opt-in job'}
          (root/'release-info.json').write_text(json.dumps(info,indent=2)+'\n')
          (root/'SHA256SUMS.txt').write_text('\n'.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name for p in sorted(root.iterdir()) if p.is_file())+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TextSpace-release-${{ steps.source.outputs.version }}
          path: artifacts/release
          if-no-files-found: error
    outputs:
      version: ${{ steps.source.outputs.version }}
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TextSpace-release-${{ needs.package.outputs.version }}
          path: release
      - name: Publish validated GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          FLAGS=()
          if [[ "$VERSION" == *-* ]]; then FLAGS+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "TextSpace $VERSION" --generate-notes "${FLAGS[@]}"
  nuget:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_nuget
    needs: package
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: TextSpace-release-${{ needs.package.outputs.version }}
          path: release
      - name: Publish explicitly requested packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$NUGET_API_KEY" || { echo 'Configure NUGET_API_KEY in the nuget environment before requesting publication.'; exit 1; }
          (cd release && sha256sum --check SHA256SUMS.txt)
          dotnet nuget push 'release/*.nupkg' --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version for a dry run (tags publish; manual runs only build and upload artifacts)
        type: string
        required: true
        default: 0.5.1-alpha.1
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  APP_NAME: TextSpace
  APP_PROJECT: src/TextSpace.App
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        name: Resolve release version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        shell: bash
        run: |
          VERSION="$INPUT_VERSION"
          if [ "$REF_TYPE" = tag ]; then VERSION="${REF_NAME#v}"; fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version '$VERSION'" >&2; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  desktop:
    name: Desktop (${{ matrix.rid }})
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Fetch pinned font assets
        run: python3 scripts/fetch-assets.py
      - name: Publish self-contained single-file executable
        shell: bash
        run: |
          dotnet publish "$APP_PROJECT" -c Release -f net10.0-desktop -r "$RID" --self-contained true \
            -p:TextSpaceDesktopOnly=true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:IncludeAllContentForSelfExtract=true -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none -p:DebugSymbols=false -p:Version="$VERSION" \
            -o "artifacts/desktop/$RID"
      - name: Package executable
        shell: bash
        run: |
          OUT="artifacts/desktop/$RID"
          find "$OUT" -name '*.pdb' -delete
          mkdir -p artifacts/dist
          BASE="$APP_NAME-$VERSION-$RID"
          if [[ "$RID" == win-* ]]; then
            mv "$OUT/$APP_NAME.App.exe" "$OUT/$APP_NAME.exe"
            test "$(find "$OUT" -type f | wc -l)" -eq 1
            (cd "$OUT" && zip -q "$GITHUB_WORKSPACE/artifacts/dist/$BASE.zip" "$APP_NAME.exe")
          else
            mv "$OUT/$APP_NAME.App" "$OUT/$APP_NAME"
            chmod +x "$OUT/$APP_NAME"
            test "$(find "$OUT" -type f | wc -l)" -eq 1
            tar -C "$OUT" -czf "artifacts/dist/$BASE.tar.gz" "$APP_NAME"
          fi
          ls -la artifacts/dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.rid }}
          path: artifacts/dist/*
          if-no-files-found: error

  package:
    needs: [version, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version and locate the successful build of this exact commit
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REQUESTED_VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${REQUESTED_VERSION:-${GITHUB_REF_NAME#v}}
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo 'Invalid semantic version'; exit 1; }
          SHA=$(git rev-parse HEAD)
          RUN=$(gh api "repos/$REPOSITORY/actions/workflows/build.yml/runs?head_sha=$SHA&status=success&per_page=100" --jq '[.workflow_runs[] | select(.event != "pull_request" and .head_branch == "main")][0].id')
          [[ "$RUN" =~ ^[0-9]+$ ]] || { echo 'This exact commit must first pass Build on main.'; exit 1; }
          gh api "repos/$REPOSITORY/actions/runs/$RUN" > /tmp/source-run.json
          jq -e --arg sha "$SHA" '.head_sha == $sha and .head_branch == "main" and .conclusion == "success" and .event != "pull_request" and .path == ".github/workflows/build.yml"' /tmp/source-run.json
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: TextSpace-browser
          path: artifacts/site
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ github.token }}
      - name: Verify browser artifact provenance
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: jq -e --arg sha "$EXPECTED_SHA" '.application == "TextSpace" and .host == "Uno WebAssembly" and .commit == $sha' artifacts/site/build-info.json
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Validate and pack reusable libraries
        shell: bash
        run: |
          set -euo pipefail
          dotnet workload install wasm-tools --skip-manifest-update
          dotnet test tests/TextSpace.Tests -c Release
          mkdir -p artifacts/release
          for component in Core Documents Editing Layout Skia OpenXml Storage Controls Editor Workbench; do
            dotnet pack "src/TextSpace.$component/TextSpace.$component.csproj" -c Release -p:Version="$VERSION" -p:PackageVersion="$VERSION" -o artifacts/release
          done
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts/release
          merge-multiple: true
      - name: Assemble source and verified browser archives
        env:
          SOURCE_RUN: ${{ steps.source.outputs.run }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --prefix="TextSpace-$VERSION/" --output="artifacts/release/TextSpace-$VERSION-source.zip" HEAD
          python3 - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          root=Path('artifacts/release')
          shutil.make_archive(str(root/f'TextSpace-{os.environ["VERSION"]}-browser'),'zip','artifacts/site')
          info={'version':os.environ['VERSION'],'sourceCommit':os.environ['SOURCE_SHA'],'validatedBuildRun':os.environ['SOURCE_RUN'],'browserBasePath':'/TextSpace/','nugetPublication':'trusted publishing for version tags'}
          (root/'release-info.json').write_text(json.dumps(info,indent=2)+'\n')
          (root/'SHA256SUMS.txt').write_text('\n'.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name for p in sorted(root.iterdir()) if p.is_file())+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: TextSpace-release-${{ steps.source.outputs.version }}
          path: artifacts/release
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/release/*.nupkg
            artifacts/release/*.snupkg
          if-no-files-found: error
    outputs:
      version: ${{ steps.source.outputs.version }}
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TextSpace-release-${{ needs.package.outputs.version }}
          path: release
      - name: Publish validated GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          FLAGS=()
          if [[ "$VERSION" == *-* ]]; then FLAGS+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "TextSpace $VERSION" --generate-notes "${FLAGS[@]}"
  nuget:
    name: Publish to NuGet.org (Trusted Publishing)
    needs: [package, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: packages
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check NuGet user
        env:
          NUGET_USER: ${{ vars.NUGET_USER || secrets.NUGET_USER }}
        run: test -n "$NUGET_USER" || { echo 'Set the NUGET_USER variable (your nuget.org profile name) for this repository or its nuget environment.' >&2; exit 1; }
      - name: NuGet login (OIDC → short-lived API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || secrets.NUGET_USER }}
      - name: Push packages
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

name: Complete visual editing integration
on:
  push:
    branches: [feat/wysiwyg-objects-equations]
    paths: [scripts/complete-visual-editing.py, .github/workflows/complete-visual-editing.yml]
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = feat/wysiwyg-objects-equations
          python3 scripts/complete-visual-editing.py
          git diff --check
          git add src tests docs benchmarks scripts .github/workflows Directory.Build.props
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: validate visual text, honor external drawing edits and test native input ownership'
          git push origin HEAD:feat/wysiwyg-objects-equations
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  engine:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: python3 -m unittest discover -s tests/build
      - run: dotnet test tests/TextSpace.Tests -c Release --logger 'trx;LogFileName=visual-final.trx' --results-directory artifacts/tests
      - name: Measure visual operations
        shell: bash
        run: |
          set -euo pipefail
          dotnet build benchmarks/TextSpace.VisualPerformance -c Release
          DOTNET_TieredCompilation=0 DOTNET_ReadyToRun=0 dotnet run --project benchmarks/TextSpace.VisualPerformance -c Release --no-build > artifacts/tests/visual-performance.json
          cat artifacts/tests/visual-performance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TextSpace-visual-final-tests
          path: artifacts/tests
  browser:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: textspace-browser-${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj') }}
      - run: dotnet workload install wasm-tools --skip-manifest-update
      - run: python3 scripts/fetch-assets.py
      - run: dotnet publish src/TextSpace.App -f net10.0-browserwasm -c Release -o artifacts/publish -p:WasmShellWebAppBasePath=/TextSpace/
      - run: python3 scripts/collect-site.py artifacts/publish site
      - name: Visual interaction acceptance
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          python3 scripts/serve-site.py site --port 0 --ready-file artifacts/server-ready.json > artifacts/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            kill -0 "$SERVER_PID" || { cat artifacts/http.log; exit 1; }
            [ -f artifacts/server-ready.json ] && break
            sleep 0.1
          done
          test -f artifacts/server-ready.json
          node scripts/verify-publication.mjs site artifacts/server-ready.json
          export TEXTSPACE_BASE_URL=$(node -e "console.log(require('./artifacts/server-ready.json').url)")
          node scripts/visual-editing-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TextSpace-visual-interaction-reports
          path: |
            test-results/visual-editing
            artifacts/*.log
          if-no-files-found: ignore

name: Engine
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test document, editing, layout and interchange libraries
        env:
          TEXTSPACE_ARTIFACTS: ${{ github.workspace }}/artifacts/engine
        run: dotnet test tests/TextSpace.Tests/TextSpace.Tests.csproj -c Release --logger 'trx;LogFileName=engine.trx' --results-directory artifacts/tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TextSpace-engine-validation
          path: artifacts
          if-no-files-found: ignore

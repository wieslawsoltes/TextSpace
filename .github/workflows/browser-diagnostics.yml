name: Browser diagnostics
on:
  push:
    branches: [feat/editor-parity]
    paths: ['.github/workflows/browser-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read failed browser acceptance report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run download 36316547525 --name TextSpace-browser-validation --dir report
          python3 - <<'PY'
          import json,pathlib
          report=json.loads(pathlib.Path('report/test-results/report.json').read_text())
          print('CHECKS:',report.get('checks'))
          print('ERRORS:',json.dumps(report.get('errors'),indent=2))
          print('CONSOLE:',json.dumps(report.get('console'),indent=2))
          print('FAILURE:',report.get('failure'))
          print('STATE:',json.dumps(report.get('state'),indent=2))
          log=pathlib.Path('report/artifacts/http.log').read_text(errors='replace')
          print('HTTP FAILURES:', '\n'.join(l for l in log.splitlines() if '404' in l or '500' in l))
          print('HTTP TAIL:', '\n'.join(log.splitlines()[-30:]))
          PY

name: Section acceptance replay
on:
  push:
    branches: [feat/sections-fields]
    paths: ['.github/workflows/sections-acceptance-replay.yml']
permissions:
  contents: write
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sections-fields
      - name: Correct foreground lookup in the real-input acceptance test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/sections-fields-check.mjs')
          text=p.read_text()
          text=text.replace('controls.find(', 'controls.findLast(')
          text=text.replace('async function click(name) {', 'async function click(name, minimumWidth = 0) {')
          text=text.replace('return c && c.x', 'return c && c.width >= minimumWidth && c.x')
          text=text.replace("await click('Rename document');", "await click('Rename document', 300);")
          p.write_text(text)
          PY
          git add scripts/sections-fields-check.mjs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'test: await the foreground backstage rename card before clicking'
            git push origin HEAD:feat/sections-fields
          fi
      - uses: actions/download-artifact@v4
        with:
          name: TextSpace-browser
          run-id: 36338336366
          github-token: ${{ github.token }}
          path: site
      - name: Verify unchanged runtime provenance
        run: jq -e '.application == "TextSpace" and .version == "0.2.0-alpha.1" and .commit == "59a5a0fc51628b2e0d3507569b45f981b70975de"' site/build-info.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Exercise real section and field UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/serve-site.py site --port 0 --ready-file artifacts/server.json > artifacts/http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            kill -0 "$PID" || { cat artifacts/http.log; exit 1; }
            [ -f artifacts/server.json ] && break
            sleep 0.1
          done
          test -f artifacts/server.json
          export TEXTSPACE_BASE_URL=$(node -e "console.log(require('./artifacts/server.json').url)")
          node scripts/sections-fields-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TextSpace-section-replay
          path: |
            test-results
            artifacts
          if-no-files-found: ignore

name: Inspect browser input
on:
  push:
    branches: [feat/continuous-sections-performance]
    paths: ['.github/workflows/inspect-browser-artifact.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    strategy:
      fail-fast: false
      matrix:
        experiment: [prearmed, show-picker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/continuous-sections-performance
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: TextSpace-browser
          path: site
          run-id: 36404437933
          github-token: ${{ github.token }}
      - name: Configure diagnostic experiment
        env:
          EXPERIMENT: ${{ matrix.experiment }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          experiment=os.environ['EXPERIMENT']
          path=Path('scripts/typography-check.mjs')
          text=path.read_text()
          marker='const state = () => page.evaluate(() => globalThis.__textSpaceState);'
          assert text.count(marker)==1
          probe='''
          await page.addInitScript(() => {
            const trace = [];
            globalThis.__fileInputTrace = trace;
            for (const type of ['keydown','keyup','click','cancel','change'])
              document.addEventListener(type, event => {
                if (event.target?.type !== 'file' && !['Control','o'].includes(event.key)) return;
                trace.push({type, key:event.key, ctrl:event.ctrlKey, target:event.target?.id || event.target?.type,
                  activated:navigator.userActivation?.isActive, prevented:event.defaultPrevented, time:performance.now()});
              },true);
          });
          '''
          if experiment=='prearmed':
              probe="page.on('filechooser', () => console.log('PERSISTENT FILECHOOSER OBSERVED'));\n"+probe
          text=text.replace(marker,probe+'\n'+marker)
          marker="report.success = false; report.failure = String(error.stack || error); process.exitCode = 1;"
          assert text.count(marker)==1
          text=text.replace(marker,marker+"\n  console.log('PICKER TRACE',JSON.stringify(await page.evaluate(()=>globalThis.__fileInputTrace)));\n  console.log('INPUTS',JSON.stringify(await page.locator('input[type=file]').evaluateAll(items=>items.map(i=>({connected:i.isConnected,disabled:i.disabled,files:i.files?.length,accept:i.accept})))));\n")
          path.write_text(text)
          if experiment=='show-picker':
              changed=[]
              for script in Path('site').rglob('*.js'):
                  source=script.read_text(errors='replace')
                  if 'TextSpaceHost' in source and 'input.click();' in source:
                      source=source.replace('input.click();','input.showPicker();')
                      script.write_text(source)
                      changed.append(str(script))
              assert len(changed)==1, 'Expected one application host script: '+str(changed)
              print('DIAGNOSTIC ONLY: changed picker call in',changed)
          print('Experiment:',experiment)
          PY
      - name: Reproduce using the original keyboard and DOCX assertions
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          mkdir -p artifacts
          python3 scripts/serve-site.py site --port 0 --ready-file artifacts/server-ready.json >/tmp/server.log 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            kill -0 "$SERVER"
            [ -f artifacts/server-ready.json ] && break
            sleep 0.1
          done
          export TEXTSPACE_BASE_URL=$(node -e "console.log(require('./artifacts/server-ready.json').url)")
          node scripts/typography-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TextSpace-input-diagnostics-${{ matrix.experiment }}
          path: test-results/typography

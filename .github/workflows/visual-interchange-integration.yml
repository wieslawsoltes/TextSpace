name: Integrate visual interchange
on:
  push:
    branches: [feat/wysiwyg-objects-equations]
    paths: [scripts/integrate-visual-interchange.py, .github/workflows/visual-interchange-integration.yml]
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = feat/wysiwyg-objects-equations
          python3 scripts/integrate-visual-interchange.py
          git diff --check
          git add src scripts .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: preserve structured equations and vector objects in DOCX interchange'
          git push origin HEAD:feat/wysiwyg-objects-equations
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  engine:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test tests/TextSpace.Tests -c Release --logger 'trx;LogFileName=visual-interchange.trx' --results-directory artifacts/tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TextSpace-visual-interchange-tests
          path: artifacts/tests

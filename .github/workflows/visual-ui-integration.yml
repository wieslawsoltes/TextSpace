name: Integrate WYSIWYG editing
on:
  push:
    branches: [feat/wysiwyg-objects-equations]
    paths: [scripts/integrate-visual-ui.py, .github/workflows/visual-ui-integration.yml]
permissions:
  contents: read
jobs:
  integrate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wysiwyg-objects-equations
      - id: commit
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = feat/wysiwyg-objects-equations
          python3 scripts/integrate-visual-ui.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests scripts .github/workflows
          git commit -m 'feat: wire direct manipulation, table gestures and on-page structural math editing'
          git push origin HEAD:feat/wysiwyg-objects-equations
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  engine:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test tests/TextSpace.Tests -c Release --logger 'trx;LogFileName=visual-engine.trx' --results-directory artifacts/tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TextSpace-visual-engine
          path: artifacts/tests
  desktop:
    needs: integrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.integrate.outputs.sha }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: python3 scripts/fetch-assets.py
      - run: dotnet build src/TextSpace.App -c Release -p:TextSpaceDesktopOnly=true

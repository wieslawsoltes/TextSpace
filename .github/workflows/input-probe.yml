name: Input probe
on:
  push:
    branches: [fix/pages-input]
    paths: ['.github/workflows/input-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 18a31c2cafb7d2d7dcecb283198f999d44b01d4b
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: TextSpace-browser
          run-id: 36319574134
          github-token: ${{ github.token }}
          path: site
      - run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Replay full real-input acceptance against unchanged application
        shell: bash
        env:
          TEXTSPACE_BASE_URL: http://127.0.0.1:4173/TextSpace/
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/serve-site.py site --port 4173 > artifacts/http.log 2>&1 &
          PID=$!; trap 'kill "$PID" || true' EXIT
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TextSpace-input-probe
          path: |
            artifacts
            test-results

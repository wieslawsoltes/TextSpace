name: Recovery byte diagnostics
on:
  push:
    branches: [fix/recovery-tab-validation]
    paths: [.github/workflows/recovery-byte-diagnostic.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: TextSpace-browser-validation
          run-id: 36449604005
          github-token: ${{ github.token }}
          path: evidence
      - name: Verify raw bytes and decoding independently of the live UI
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          console.log('NODE',process.version);
          const root='evidence/test-results/recovery/';
          const source=await fs.readFile(root+'bom-source.textspace');
          const retained=await fs.readFile(root+'bom-retained.textspace');
          console.log('RAW',JSON.stringify({sourceLength:source.length,retainedLength:retained.length,sourceHash:createHash('sha256').update(source).digest('hex'),retainedHash:createHash('sha256').update(retained).digest('hex'),prefix:[...retained.subarray(0,6)]}));
          assert.deepEqual(retained,source);
          const direct=await fs.readFile(root+'bom-retained.textspace','utf8');
          console.log('DECODERS',JSON.stringify({readFileFirst:direct.charCodeAt(0),bufferFirst:retained.toString('utf8').charCodeAt(0),textDecoderFirst:new TextDecoder('utf-8',{ignoreBOM:true,fatal:true}).decode(retained).charCodeAt(0)}));
          console.log('REPORT',await fs.readFile(root+'report.json','utf8'));
          JS

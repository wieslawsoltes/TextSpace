name: Integrate visual editing core
on:
  push:
    branches: [feat/wysiwyg-objects-equations]
    paths: [scripts/integrate-visual-core.py, .github/workflows/visual-core-integration.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wysiwyg-objects-equations
      - name: Apply asserted integrations
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = feat/wysiwyg-objects-equations
          python3 scripts/integrate-visual-core.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests scripts .github/workflows
          git commit -m 'feat: integrate retained objects and equation layout with existing document flow'
          git push origin HEAD:feat/wysiwyg-objects-equations
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Validate engine and new visual-object tests
        run: dotnet test tests/TextSpace.Tests -c Release --logger 'trx;LogFileName=visual-core.trx' --results-directory artifacts/tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TextSpace-visual-core-validation
          path: artifacts/tests

name: Integrate tested typography source
on:
  push:
    branches: [feat/typography-performance]
    paths: ['.github/workflows/apply-typography.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/typography-performance
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify and apply the tested source patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import base64,concurrent.futures,gzip,hashlib,json,os,pathlib,urllib.request
          root=pathlib.Path('/tmp/textspace-typography'); root.mkdir(exist_ok=True)
          api='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'TextSpace-integrity-validation'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(api+path,headers=headers),timeout=60) as response:
                  return json.load(response)
          trees=['b5eabd625633cc85a6def35f96262277b7957c58','55557342823132e9d78dd8cdface6cff2d48be18','884d66876463437f0949bb99ef5e7c19da1d8651','54ca0db89216a29f74bcbc07dea6665fd0707112']
          entries=[entry for tree in trees for entry in get('trees/'+tree)['tree']]
          def read(entry):
              response=get('blobs/'+entry['sha']); data=base64.b64decode(response['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==entry['sha']
              return entry['path'],data.decode('ascii')
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as executor:
              parts=dict(executor.map(read,entries))
          expected='''420bc9f3358bfc4d7c03f3fcc0c5dd869ae1f0299c58b23ef37a3f001d60c04e
          fcf7b0674addb041660f13f62bd9b19d58c5c3a5f453577eccc89b1dc7f816c2
          2f731d9b63d976bf69bd6ed798d923273e8869d3eebb8b51d46f4d72f39dc7a8
          e44e329dabf56e8866b7323387606b3e74bd43df6d134724b708354fb2a4b5db
          43f4b6b2e55908ba0d7d5cbdfdb54ff44ec0b7b36945887021a8ff1d3cf70256
          58b018fc28a981c716d840c6fddc887d79f0b218ec3602649fc6202aa2ee8bd4
          de6ec3fb2d5f3d7b5ddf21ff694161c14be37a3f4bac3cdb8be60dd0f2ac3710
          1805c4575937a0d32bdb12606444a18bf0701f9cb84c181db91ed6f79039bc0d
          4ed7cadff4ba050d61e024280190c9d2bfa4cead0ddace73cc889547d54280f2
          35ffc20d6a0c4c22a3ed5832368e04acf95ae84061b7061e49f6f6eb8b915bf7
          8365758605a0178446baf649e7f903070e00e3a007860f0ea5dee2c619588d85
          b09dd231f6a84e409d58ce0690dbc3f514ffbc734233f6af13d602aeca39ffcc
          8f91af97042f93d89969afc8dbaf3ee7bba85fb2e0181de2ef9720f322cf6e7e
          6ea973c5d103eba9808f65d7b7b81e9f6da6e53fc9307a8dcc4f94f36a84d12d
          6e5a68d170fc0b7c7aba3d293a30648611e4a5bc904ff591c1c9600ce8d3a89d
          560cf604a63da439638bb3b112605faa1e6112d14910a9b10d0c510a0b143553
          575b0ab52ff58d421c66cb4ee6992af74b9612a320556675f662b0991f15336a
          2fc8801dee2093608a7c6205f70970d9a5806994627d06285ce59ccc510c19d7
          41b2bf009fb3e9c7c9b6c50c00f019aa9ad3a713bdf9f766291d276589c2b5f2
          ef8e587eb5c596b165ec8b5665286f9aac4556d2dafcaef00575f8c1b0737340
          a211c5bc814f12686edea68ac14590c47cdba67346f419f80878e16141cfbad5
          f2150c84e02a21299a613feeb94661ebcc39a7426176ce40c6a330aa429965bc
          ae8e02780ff39945661f914278ecace49ed4b466ec6c3ab5d0a0a6d9ba2cba50
          65cb813540d1bac9ee8f4531826fd4e03b0c30f14b267ecac78b8a14d1ee1e4b
          4265ba21a2418a2128e1c1230f4bcb9d52dd9bd343992761372a4d0181da8c2a
          1ebaa1e87aefad1066bc5e1915f2b980c858ecdc7c93bb706aed196eb21d2c11
          dac15be84b5d8db2ddb147621437923a748ff9f1d82d7ce522d9935d14b0e8a9
          0f8da3215d40680d9bcd2f953c2a0dde68885b7cc9a0f63bc028d506f23179c6
          4d837eec4d08e0df84222f70173aa1ecc525ceb5e7ff94282ad3601739a61ba5
          489aa1e11bdb3803bc204aea9602b9f4eb22d917939597973b03b5b1ac21407d
          67ae189c1a6ea9c2f784d7f5d7a8ba4081a0cbc6ac4de0403899394c210d7b58
          0f96ee99e2ee4755e2e4d9e1ec4bcaf67195abc1abb192bf3ee834bc696b8147
          cf913574e9663ded7ee7aad6a8009b209688cebf2eef2620e74705fade5d595a
          c061201fb99ced477aaf1408faa9983c8976eaa669735bf3d0667fbdf3490815
          5d58a3a1abe893c36eb19ef620accd81692f128f78167d435b45f31f6d920fd1'''.split()
          # Repair known transmission-only duplicated characters; every chunk and the final patch are hash verified.
          repairs={'05':('eNmJZ0VBO','eNmJ0VBO'),'10':('/9aXzXzODh','/9aXzODh'),'11':('UvreqLreqLJl','UvreqLJl')}
          for name,(before,after) in repairs.items(): parts[name]=parts[name].replace(before,after)
          failures=[]
          assert len(parts)==len(expected)==35
          for i,digest in enumerate(expected):
              name=f'{i:02d}'; data=parts[name].encode('ascii'); (root/(name+'.txt')).write_bytes(data)
              actual=hashlib.sha256(data).hexdigest()
              if actual!=digest: failures.append({'chunk':name,'expected':digest,'actual':actual})
          (root/'integrity.json').write_text(json.dumps(failures,indent=2))
          if failures: raise RuntimeError('Chunk integrity failure: '+json.dumps(failures))
          patch=gzip.decompress(base64.b64decode(''.join(parts[f'{i:02d}'] for i in range(35)),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='f02fe6a857227b83ff71d7a57fc62d096032095996b00be819979d465545b7e2'
          (root/'source.patch').write_bytes(patch)
          print('Verified typography source:',len(patch),'bytes')
          PY
          git apply --index /tmp/textspace-typography/source.patch
          dotnet test tests/TextSpace.Tests -c Release --logger 'trx;LogFileName=engine.trx' --results-directory /tmp/textspace-typography/tests
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add tab stops, leaders, paragraph pagination and cached glyph rendering'
          git push origin HEAD:feat/typography-performance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TextSpace-typography-integration
          path: /tmp/textspace-typography
          if-no-files-found: ignore

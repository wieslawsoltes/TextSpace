name: Finish current performance work
on:
  push:
    branches: [perf/paragraph-layout]
    paths: ['.github/workflows/finish-performance.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/paragraph-layout
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Integrate revision-checked source and verify regressions
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/finish-performance.py
          dotnet test tests/TextSpace.Tests -c Release
          git rm scripts/finish-performance.py
          git add src tests
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: reuse paragraph layout, index caret queries and reuse print pagination'
          git push origin HEAD:perf/paragraph-layout

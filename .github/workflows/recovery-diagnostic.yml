name: Recovery diagnostics
on:
  push:
    branches: [fix/recovery-tab-validation]
    paths: [.github/workflows/recovery-diagnostic.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: TextSpace-browser
          run-id: 36438984981
          github-token: ${{ github.token }}
          path: site
      - name: Install browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Inspect unchanged application recovery state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/serve-site.py site --port 0 --ready-file artifacts/server.json > artifacts/http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          for i in $(seq 1 100); do [ -f artifacts/server.json ] && break; sleep 0.1; done
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs/promises';
          const { url } = JSON.parse(await fs.readFile('artifacts/server.json','utf8'));
          const browser=await chromium.launch({args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          page.on('pageerror',e=>console.log('PAGEERROR',e.message));
          page.on('console',m=>{if(m.type()==='error'||m.type()==='warning')console.log('CONSOLE',m.type(),m.text());});
          await page.goto(url+'?test=1');
          await page.waitForFunction(()=>globalThis.__textSpaceState?.ready,null,{timeout:120000});
          await page.evaluate(async()=>{
            const original=JSON.stringify({formatVersion:1,id:'fixture',title:'Keep text',blocks:[{$type:'paragraph',id:'p',format:{tabStops:Array.from({length:129},(_,position)=>({position,alignment:'Right',leader:'Dot'}))},runs:[{text:'Preserve words'}]}]});
            const db=await new Promise((resolve,reject)=>{const r=indexedDB.open('TextSpace',1);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});
            await new Promise((resolve,reject)=>{const tx=db.transaction('workspace','readwrite');tx.objectStore('workspace').put({document:original,title:'Keep text'},'latest');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});db.close();
          });
          await page.reload();
          await page.waitForTimeout(15000);
          console.log('RECOVERY_STATE',JSON.stringify(await page.evaluate(()=>({error:globalThis.__textSpaceError,recovery:globalThis.__textSpaceRecoveryState,ready:globalThis.__textSpaceReady,enabled:globalThis.TextSpaceHost?.diagnosticsEnabled(),recoveryBridge:!!globalThis.TextSpaceRecovery,text:document.body.innerText,canvases:document.querySelectorAll('canvas').length})),null,2));
          await page.screenshot({path:'artifacts/recovery.png'});
          await browser.close();
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Recovery-diagnostic-evidence
          path: artifacts

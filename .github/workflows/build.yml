name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test engine and interchange
        run: dotnet test tests/TextSpace.Tests -c Release --logger 'trx;LogFileName=engine.trx' --results-directory artifacts/tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TextSpace-engine-validation
          path: artifacts/tests
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fetch-assets.py
      - run: dotnet build src/TextSpace.App -c Release -p:TextSpaceDesktopOnly=true
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: textspace-browser-${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj') }}
      - name: Prepare WebAssembly and fonts
        run: |
          dotnet workload install wasm-tools --skip-manifest-update
          python3 scripts/fetch-assets.py
      - name: Publish real Uno application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          dotnet publish src/TextSpace.App -f net10.0-browserwasm -c Release -o artifacts/publish -p:WasmShellWebAppBasePath=/TextSpace/ 2>&1 | tee artifacts/browser-build.log
          python3 scripts/collect-site.py artifacts/publish site
      - name: Browser acceptance against verified static publication
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          python3 scripts/serve-site.py site --port 0 --ready-file artifacts/server-ready.json > artifacts/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 100); do
            kill -0 "$SERVER_PID" || { cat artifacts/http.log; exit 1; }
            [ -f artifacts/server-ready.json ] && break
            sleep 0.1
          done
          test -f artifacts/server-ready.json
          node scripts/verify-publication.mjs site artifacts/server-ready.json
          export TEXTSPACE_BASE_URL=$(node -e "console.log(require('./artifacts/server-ready.json').url)")
          npm run test:browser
      - name: Build ten reusable NuGet packages
        shell: bash
        run: |
          set -euo pipefail
          for component in Core Documents Editing Layout Skia OpenXml Storage Controls Editor Workbench; do
            dotnet pack "src/TextSpace.$component/TextSpace.$component.csproj" -c Release -o artifacts/packages
          done
          python3 - <<'PY'
          from pathlib import Path
          packages = list(Path('artifacts/packages').glob('*.nupkg'))
          assert len(packages) == 10, f'Expected ten packages, found {len(packages)}'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TextSpace-browser-validation
          path: |
            artifacts/*.log
            artifacts/*.json
            test-results
            package-lock.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TextSpace-browser
          path: site
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: TextSpace-packages
          path: artifacts/packages
          if-no-files-found: error
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip --output=/tmp/TextSpace-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: TextSpace-source
          path: /tmp/TextSpace-source.zip
